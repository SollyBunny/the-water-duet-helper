<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Duet Helper</title>
        <style>
            :root {
                --bg: #101218;
                --panel: #191e29;
                --line: #2b3342;
                --muted: #9aa5b5;
                --accent: #8b9cff;
                --text: #eef2f8;
                --waveform: #111620;
                --border: 2px solid var(--line);
                --padding: 1em;
            }
            body {
                margin: 0;
                padding: 32px 20px;
                color-scheme: dark;
                background: var(--bg);
                color:var(--text);
                font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
            }

            main {
                max-width: 75ch;
                margin: auto;
                position: relative;
                padding-bottom: 6em;
            }

            h1, h2 {
                margin: 0;
            }

            input {
                accent-color: var(--accent);
            }

            .track {
                background: var(--panel);
                border: var(--border);
                margin: var(--padding);
                border-radius: var(--padding);
                padding: var(--padding);
                display: flex;
                gap: var(--padding);
                height: 5rem;
            }
                .track-info {
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    min-width: 20ch;
                }
                    .track-name {
                        font-weight: 900;
                    }
                    .track-path {
                        color: var(--muted);
                        font-size: 0.8rem;
                    }
                .track-volume {
                    writing-mode: vertical-lr;
                    direction: rtl;
                    appearance: slider-vertical;
                    width: 16px;
                    vertical-align: bottom;
                    padding-right: var(--padding);
                    cursor: pointer;
                }
                .track-wave {
                    position: relative;
                    flex-grow: 1;
                    min-width: 0;
                    border-radius: var(--padding);
                    background: var(--waveform);
                    overflow: hidden;
                }
                    .track-peaks {
                        display: block;
                        width: 100%;
                        height: 100%;
                        cursor: pointer;
                    }
                    .track-playhead {
                        position: absolute;
                        top: 0;
                        bottom: 0;
                        left: 0;
                        width: 2px;
                        background: #fff;
                        box-shadow: 0 0 7px #fff9;
                        pointer-events: none;
                    }
                .track-error .track-path {
                    color: #ff9b9b;
                }

            #player {
                left: 50%;
                transform: translateX(-50%);
                width: min(50ch, calc(100% - 40px));
                box-sizing: border-box;
                position: fixed;
                background: var(--panel);
                bottom: var(--padding);
                border-radius: var(--padding);
                padding: var(--padding);
                gap: var(--padding);
                display: flex;
                align-items: center;
            }
                #player-button {
                    background: none;
                    outline: none;
                    border: none;
                    color: var(--text);
                    font: inherit;
                    font-weight: 700;
                    width: 6ch;
                    flex: none;
                    text-align: center;
                    cursor: pointer;
                }
                #player-button:disabled {
                    color: var(--muted);
                    cursor: wait;
                }
                #player-seek {
                    flex-grow: 1;
                }
                #player-time {
                    color: var(--muted);
                    font-size: 0.85rem;
                    font-variant-numeric: tabular-nums;
                    white-space: nowrap;
                }

            #lyrics h3 {
                margin: 1.2em 0 0.2em;
                font-size: 0.8rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
            }
            #lyrics div {
                padding: 0.1em 0;
            }

            .hint {
                margin: 0.5em var(--padding);
                color: var(--muted);
                font-size: 0.85rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>The Water - Johnny Flynn</h1>
            <p class="hint">Click a waveform to seek. Each track has its own volume slider.</p>
            <section id="tracks" aria-label="Audio tracks">
                <p>Loading tracks...</p>
            </section>
            <h2>Lyrics</h2>
            <section id="lyrics">
                <p>Loading lyrics...</p>
            </section>
            <section id="player">
                <button id="player-button" disabled aria-pressed="false">Play</button>
                <input id="player-seek" type="range" value="0" min="0" max="1000" aria-label="Seek" disabled>
                <span id="player-time">0:00 / 0:00</span>
            </section>
        </main>
        <script src="index.mjs" type="module"></script>
    </body>
</html>
