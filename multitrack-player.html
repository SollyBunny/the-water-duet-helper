<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multitrack Audio Player</title>
<style>
  :root { color-scheme: dark; --bg:#101218; --panel:#191e29; --line:#2b3342; --muted:#9aa5b5; --accent:#8b9cff; --text:#eef2f8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 20px; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:1100px; margin:auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
  h1 { margin:0; font-size:clamp(22px,4vw,30px); letter-spacing:-.03em; }
  .transport { display:flex; align-items:center; gap:12px; }
  button { border:0; border-radius:10px; padding:10px 17px; background:var(--accent); color:#101426; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.45; cursor:wait; }
  #clock { min-width:112px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #status { color:var(--muted); margin:0 0 16px; min-height:1.5em; }
  #tracks { display:grid; gap:12px; }
  .track { display:grid; grid-template-columns:minmax(220px,290px) minmax(0,1fr); gap:18px; align-items:center; padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .meta { min-width:0; }
  .track-name { font-weight:700; margin-bottom:4px; overflow-wrap:anywhere; }
  .filename { color:var(--muted); font-size:12px; overflow-wrap:anywhere; margin-bottom:12px; }
  .volume { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
  input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
  .wave-wrap { position:relative; min-width:0; height:86px; border-radius:8px; overflow:hidden; background:#111620; }
  canvas { display:block; width:100%; height:100%; }
  .playhead { position:absolute; top:0; bottom:0; left:0; width:2px; background:#fff; box-shadow:0 0 7px #fff9; pointer-events:none; }
  .wave-empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:12px; pointer-events:none; }
  .hint { margin-top:18px; color:var(--muted); font-size:12px; }
  @media (max-width:680px) { body { padding:22px 12px; } .track { grid-template-columns:1fr; gap:12px; } .wave-wrap { height:76px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Multitrack audio</h1>
    <div class="transport">
      <button id="toggle" disabled>Loading…</button>
      <span id="clock">0:00 / 0:00</span>
    </div>
  </header>
  <p id="status">Loading index.json…</p>
  <section id="tracks" aria-label="Audio tracks"></section>
  <p class="hint">All tracks start together. Use each slider to adjust that track’s volume. Click a waveform to seek all tracks.</p>
</main>
<script>
(() => {
  const tracksEl = document.querySelector('#tracks');
  const statusEl = document.querySelector('#status');
  const toggleBtn = document.querySelector('#toggle');
  const clockEl = document.querySelector('#clock');
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const tracks = [];
  let duration = 0, playing = false, startedAt = 0, offset = 0, raf = 0;

  const fmt = s => {
    s = Math.max(0, Math.floor(s || 0));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2,'0')}`;
  };
  const currentTime = () => playing ? Math.min(duration, offset + (audioContext.currentTime - startedAt)) : offset;

  function drawWave(canvas, peaks) {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const mid = h/2, step = w/peaks.length;
    ctx.fillStyle = '#8495ff';
    for (let i=0; i<peaks.length; i++) {
      const amp = Math.max(1, peaks[i] * (h*.44));
      ctx.fillRect(i*step, mid-amp, Math.max(1,step*.72), amp*2);
    }
  }

  function makePeaks(buffer, count=1400) {
    const data = buffer.getChannelData(0);
    const peaks = new Float32Array(count);
    const block = Math.max(1, Math.floor(data.length/count));
    for (let i=0; i<count; i++) {
      let peak=0, start=i*block, end=Math.min(data.length,start+block);
      for (let j=start; j<end; j++) peak=Math.max(peak,Math.abs(data[j]));
      peaks[i]=peak;
    }
    return peaks;
  }

  function updateUI() {
    const t = currentTime();
    clockEl.textContent = `${fmt(t)} / ${fmt(duration)}`;
    for (const track of tracks) {
      const pct = duration ? Math.min(100, t/duration*100) : 0;
      track.head.style.left = pct + '%';
    }
    if (playing && t >= duration) pause();
    else if (playing) raf = requestAnimationFrame(updateUI);
  }

  function stopSources() {
    for (const track of tracks) {
      if (track.source) {
        try { track.source.stop(); } catch (_) {}
        track.source.disconnect();
        track.source = null;
      }
    }
  }

  async function play() {
    if (!tracks.length || playing) return;
    await audioContext.resume();
    stopSources();
    for (const track of tracks) {
      if (offset >= track.buffer.duration) continue;
      const source = audioContext.createBufferSource();
      source.buffer = track.buffer;
      source.connect(track.gain);
      source.start(0, offset);
      track.source = source;
    }
    startedAt = audioContext.currentTime;
    playing = true;
    toggleBtn.textContent = 'Pause';
    cancelAnimationFrame(raf);
    updateUI();
  }

  function pause() {
    if (!playing) return;
    offset = currentTime();
    playing = false;
    stopSources();
    cancelAnimationFrame(raf);
    toggleBtn.textContent = 'Play';
    updateUI();
  }

  function seek(time) {
    offset = Math.max(0, Math.min(duration, time));
    if (playing) { playing = false; stopSources(); play(); }
    else updateUI();
  }

  toggleBtn.addEventListener('click', () => playing ? pause() : play());

  async function init() {
    try {
      const response = await fetch('./index.json');
      if (!response.ok) throw new Error(`Could not fetch index.json (${response.status})`);
      const manifest = await response.json();
      const entries = Object.entries(manifest.files || manifest);
      if (!entries.length) throw new Error('No audio files found in index.json.');

      statusEl.textContent = `Loading ${entries.length} audio file(s)…`;
      const loaded = await Promise.all(entries.map(async ([name, path]) => {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`Could not fetch ${path} (${res.status})`);
        const buffer = await audioContext.decodeAudioData(await res.arrayBuffer());
        return { name, path, buffer };
      }));

      for (const item of loaded) {
        const row = document.createElement('article');
        row.className = 'track';
        const meta = document.createElement('div'); meta.className = 'meta';
        const name = document.createElement('div'); name.className = 'track-name'; name.textContent = item.name;
        const filename = document.createElement('div'); filename.className = 'filename'; filename.textContent = item.path;
        const volumeWrap = document.createElement('label'); volumeWrap.className = 'volume';
        const volumeText = document.createElement('span'); volumeText.textContent = 'Volume';
        const slider = document.createElement('input'); slider.type = 'range'; slider.min = '0'; slider.max = '1'; slider.step = '.01'; slider.value = '1'; slider.setAttribute('aria-label', `${item.name} volume`);
        const gain = audioContext.createGain(); gain.gain.value = 1; gain.connect(audioContext.destination);
        slider.addEventListener('input', () => gain.gain.value = Number(slider.value));
        volumeWrap.append(volumeText, slider); meta.append(name, filename, volumeWrap);

        const wave = document.createElement('div'); wave.className = 'wave-wrap';
        const canvas = document.createElement('canvas'); canvas.setAttribute('aria-label', `${item.name} waveform`);
        const head = document.createElement('div'); head.className = 'playhead';
        wave.append(canvas, head);
        wave.addEventListener('click', e => {
          const rect = wave.getBoundingClientRect();
          seek((e.clientX - rect.left) / rect.width * duration);
        });
        row.append(meta, wave); tracksEl.append(row);
        const track = { ...item, gain, source:null, head, canvas };
        tracks.push(track);
        drawWave(canvas, makePeaks(item.buffer));
        duration = Math.max(duration, item.buffer.duration);
      }
      statusEl.textContent = `${tracks.length} track(s) ready.`;
      toggleBtn.disabled = false; toggleBtn.textContent = 'Play';
      updateUI();
    } catch (error) {
      statusEl.textContent = `Error: ${error.message}`;
      console.error(error);
    }
  }

  window.addEventListener('resize', () => tracks.forEach(t => drawWave(t.canvas, makePeaks(t.buffer))));
  init();
})();
</script>
</body>
</html>
